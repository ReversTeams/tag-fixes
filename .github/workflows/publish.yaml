name: Publish Minecraft Mod

on:
  push:
    tags:
      - "*"

jobs:
  test:
    name: Test (${{ matrix.loader }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build + test
        run: |
          case "${{ matrix.loader }}" in
            fabric)
              ./gradlew :fabric:build :fabric:runServer --no-daemon
              ;;
            forge)
              ./gradlew :forge:build :forge:runServer --no-daemon
              ;;
            neoforge)
              ./gradlew :neoforge:build :neoforge:runServer --no-daemon
              ;;
          esac
  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Mod
        run: ./gradlew build

      - name: Publish mod files
        uses: tristankechlo/publish-mc-mod@v2.0.0
        with:
          mc-version: "1.21.1"
          mod-version: "1.0.5"
          curseforge-id: 1416898
          modrinth-id: "dJZCkoBx"
          version-range: "[1.21.1,1.22)"
          version-type: "beta"
          
          loaders: "fabric,forge,neoforge"
          changelog: "Ported mod to Forge, Neoforge and Fabric 1.21.1+."

          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}