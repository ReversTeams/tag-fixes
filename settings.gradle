pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
        mavenCentral()
    }
}

rootProject.name = "tagfixes"

include("common")

// Fabric
include("fabric:1.20.1")
project(":fabric:1.20.1").projectDir = file("fabric/fabric-1.20.1")

// Forge
include("forge:1.20.1")
project(":forge:1.20.1").projectDir = file("forge/forge-1.20.1")

// NeoForge
include("neoforge:1.21.1")
project(":neoforge:1.21.1").projectDir = file("neoforge/neoforge-1.21.1")