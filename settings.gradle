pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven {
            name "neoforged"
            url "https://maven.neoforged.net/releases"
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'tagfixes'

include 'common'
include 'fabric'
include 'forge'
include 'neoforge'