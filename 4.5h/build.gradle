plugins {
    id "base"
}

allprojects {
    group = property("maven_group")
    version = property("mod_version")


    repositories {
        mavenCentral()

        maven { url = "https://maven.fabricmc.net" }
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://maven.neoforged.net/releases" }
    }

    ext {
        mod_id = project.property("mod_id")
        mod_name = project.property("mod_name")
        mod_version = project.property("mod_version")
        mod_description = project.property("mod_description")
        mod_author = project.property("mod_author")
        mod_license = project.property("mod_license")
        display_url = project.property("display_url")
        logo_file = project.property("logo_file")
        credits = project.property("credits")
    }


    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    def mcVersions = [
        ":fabric:1.20.1" : "1.20.1",
        ":forge:1.20.1" : "1.20.1",
        ":neoforge:1.21.1" : "1.21.1"
    ]
    def mcVersion = mcVersions[project.path] ?: ""
    def mcVersionNext = ""
    if (mcVersion) {
        def parts = mcVersion.split('\\.')
        def major = parts[0].toInteger()
        def minor = parts[1].toInteger()
        mcVersionNext = "${major}.${minor + 1}"
    }

    buildDir = file("${projectDir}/build")

    tasks.withType(ProcessResources).configureEach {
        inputs.properties([
            mod_id: rootProject.ext.mod_id,
            mod_name: rootProject.ext.mod_name,
            mod_version: rootProject.ext.mod_version,
            mod_description: rootProject.ext.mod_description,
            mod_author: rootProject.ext.mod_author,
            mod_license: rootProject.ext.mod_license,
            display_url: rootProject.ext.display_url,
            logo_file: rootProject.ext.logo_file,
            credits: rootProject.ext.credits,
            minecraft_version: mcVersion,
            minecraft_version_next: mcVersionNext
        ])

        filesMatching([
            "fabric.mod.json",
            "META-INF/mods.toml",
            "META-INF/neoforge.mods.toml"
        ]) {
            expand(inputs.properties)
        }

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds all loader/version jars"
    dependsOn subprojects.collect { it.tasks.named("build") }
}